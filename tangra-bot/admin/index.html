<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tangra Square — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="topbar">
  <h1>🥡 Tangra Square <span>Admin</span></h1>
  <button id="refreshBtn" class="refresh-btn">↻ Refresh</button>
</header>

<section class="summary" id="summary">
  <div class="summary-card">
    <span class="summary-label">Today's Orders</span>
    <span class="summary-value" id="todayCount">0</span>
  </div>
  <div class="summary-card">
    <span class="summary-label">Today's Revenue</span>
    <span class="summary-value" id="todayRevenue">₹0</span>
  </div>
</section>

<nav class="filter-tabs" id="filterTabs">
  <button class="filter-tab active" data-status="All">All</button>
  <button class="filter-tab" data-status="New">New</button>
  <button class="filter-tab" data-status="Preparing">Preparing</button>
  <button class="filter-tab" data-status="Ready">Ready</button>
  <button class="filter-tab" data-status="Delivered">Delivered</button>
  <button class="filter-tab" data-status="Cancelled">Cancelled</button>
</nav>

<main id="ordersList" class="orders-list">
  <div class="loading">Orders load ho rahe hain…</div>
</main>

<script src="script.js"></script>
</body>
</html>
